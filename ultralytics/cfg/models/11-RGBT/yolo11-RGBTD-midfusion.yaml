# YOLO11 RGBTD（可见光 + 红外 + 深度）三模态目标检测模型
#
# 设计要点（面向"复用现有模型参数简化训练"）：
#   1. 三条分支均设计为与官方 YOLO11 backbone 完全同构的 3 通道结构，
#      可 100% 复用 COCO 预训练权重（见 transfer_pretrained.py）；
#   2. 融合层 ModalConcat（三路 Concat + 1×1 卷积）把通道压回官方对应尺度，
#      使 SPPF/C2PSA/检测头也与官方同构，可继续复用预训练；
#   3. 输入 9 通道 = BGR(3) + IR(3) + Depth(3)，由 base.py 的 use_simotm='RGBTD' 加载。

# Parameters
nc: 80 # number of classes（训练时由 data.yaml 的 nc 自动覆盖）
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

ch: 9  # BGR(3) + IR(3) + Depth(3)

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Silence, []]  # 0

  # ---- 可见光分支 (3ch) ----
  - [0, 1, SilenceChannel, [0, 3]]  # 1
  - [-1, 1, Conv, [64, 3, 2]]  # 2
  - [-1, 1, Conv, [128, 3, 2]]  # 3
  - [-1, 2, C3k2, [256, False, 0.25]]  # 4
  - [-1, 1, Conv, [256, 3, 2]]  # 5
  - [-1, 2, C3k2, [512, False, 0.25]]  # 6  (P3/8)
  - [-1, 1, Conv, [512, 3, 2]]  # 7
  - [-1, 2, C3k2, [512, True]]  # 8  (P4/16)
  - [-1, 1, Conv, [1024, 3, 2]]  # 9
  - [-1, 2, C3k2, [1024, True]]  # 10 (P5/32)

  # ---- 红外分支 (3ch) ----
  - [0, 1, SilenceChannel, [3, 6]]  # 11
  - [-1, 1, Conv, [64, 3, 2]]  # 12
  - [-1, 1, Conv, [128, 3, 2]]  # 13
  - [-1, 2, C3k2, [256, False, 0.25]]  # 14
  - [-1, 1, Conv, [256, 3, 2]]  # 15
  - [-1, 2, C3k2, [512, False, 0.25]]  # 16 (P3/8)
  - [-1, 1, Conv, [512, 3, 2]]  # 17
  - [-1, 2, C3k2, [512, True]]  # 18 (P4/16)
  - [-1, 1, Conv, [1024, 3, 2]]  # 19
  - [-1, 2, C3k2, [1024, True]]  # 20 (P5/32)

  # ---- 深度分支 (3ch) ----
  - [0, 1, SilenceChannel, [6, 9]]  # 21
  - [-1, 1, Conv, [64, 3, 2]]  # 22
  - [-1, 1, Conv, [128, 3, 2]]  # 23
  - [-1, 2, C3k2, [256, False, 0.25]]  # 24
  - [-1, 1, Conv, [256, 3, 2]]  # 25
  - [-1, 2, C3k2, [512, False, 0.25]]  # 26 (P3/8)
  - [-1, 1, Conv, [512, 3, 2]]  # 27
  - [-1, 2, C3k2, [512, True]]  # 28 (P4/16)
  - [-1, 1, Conv, [1024, 3, 2]]  # 29
  - [-1, 2, C3k2, [1024, True]]  # 30 (P5/32)

  # ---- 三路融合：ModalConcat 输出通道对齐官方尺度（P3/P4/P5） ----
  - [[6, 16, 26], 1, ModalConcat, [256]]  # 31 (P3)
  - [[8, 18, 28], 1, ModalConcat, [512]]  # 32 (P4)
  - [[10, 20, 30], 1, ModalConcat, [1024]]  # 33 (P5)

  - [-1, 1, SPPF, [1024, 5]]  # 34
  - [-1, 2, C2PSA, [1024]]  # 35

# 检测头与官方 YOLO11 同构（通道已由 ModalConcat 对齐，可复用预训练）
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 36
  - [[-1, 32], 1, Concat, [1]]  # 37 (cat P4)
  - [-1, 2, C3k2, [512, False]]  # 38
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 39
  - [[-1, 31], 1, Concat, [1]]  # 40 (cat P3)
  - [-1, 2, C3k2, [256, False]]  # 41 (P3/8-small)
  - [-1, 1, Conv, [256, 3, 2]]  # 42
  - [[-1, 38], 1, Concat, [1]]  # 43 (cat head P4)
  - [-1, 2, C3k2, [512, False]]  # 44 (P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]]  # 45
  - [[-1, 35], 1, Concat, [1]]  # 46 (cat head P5)
  - [-1, 2, C3k2, [1024, True]]  # 47 (P5/32-large)
  - [[41, 44, 47], 1, Detect, [nc]]  # 48 Detect(P3, P4, P5)
